version: 2

# Keeps Cargo dependencies and the actions used by the workflows up to date.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Patch releases are grouped; minor and major bumps (which may break the
      # gtk-rs 0.x API) arrive as separate pull requests for review.
      cargo-patch:
        patterns: ["*"]
        update-types: ["patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

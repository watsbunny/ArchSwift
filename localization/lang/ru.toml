[app]
subtitle = "Установщик пакетов Arch Linux"
window_package = "ArchSwift — {package}"
window_install = "ArchSwift — установка {package}"
window_success = "ArchSwift — установка завершена"
window_error = "ArchSwift — ошибка установки"

[common]
dash = "—"
none = "нет"
unknown = "неизвестно"

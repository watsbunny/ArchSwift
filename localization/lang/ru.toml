[welcome]
heading = "Добро пожаловать в ArchSwift"
intro = "Этот мастер установит локальный пакет Arch Linux. Сначала проверьте сведения о пакете, затем нажмите «Далее»: система запросит права администратора через Polkit, после чего пакет будет установлен с помощью pacman."
section_title = "Сведения о пакете"
warning_title = "Важно"
warning_text = "Устанавливайте только пакеты, собранные для вашей архитектуры и полученные из источника, которому вы доверяете. Пакет может выполнить произвольные действия от имени root через свои install-скрипты."
choose_hint = "Поддерживаются .pkg.tar.zst и совместимые форматы архивов пакетов."
not_selected = "Пакет не выбран. Нажмите «Выбрать пакет…» или откройте файл .pkg.tar.zst двойным щелчком."

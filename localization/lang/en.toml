close = "Close"
next = "Next"
installing = "Installing…"
finish = "Finish"
retry = "Retry"
loading = "Loading…"
choose_package = "Choose package…"

[welcome]
heading = "Welcome to ArchSwift"
intro = "This wizard installs a local Arch Linux package. First review the package information, then click “Next”: the system will request administrator rights through Polkit, after which the package will be installed with pacman."
section_title = "Package information"
warning_title = "Important"
warning_text = "Install only packages built for your architecture and obtained from a source you trust. A package can perform arbitrary actions as root through its install scripts."
choose_hint = "Supports .pkg.tar.zst and compatible package archive formats."
not_selected = "No package selected. Click “Choose package…” or open a .pkg.tar.zst file by double-clicking it."
reading = "Reading package metadata…"
ready = "Package {package} is ready to install. Click “Next”."
error = "Could not read the package:\n{error}"

[meta]
pkgname = "Package name"
version = "Version"
arch = "Architecture"
description = "Description"
url = "Website"
packager = "Packager"
build_date = "Build date"
installed_size = "Installed size"
file_size = "File size"
licenses = "Licenses"
depends = "Dependencies"
optdepends = "Optional dependencies"
provides = "Provides"
conflicts = "Conflicts"
replaces = "Replaces"
groups = "Groups"
signature = "Signature"
install_script = "Install script"
path = "Path"
sig_found = "found (.sig) — pacman will verify the signature"
sig_missing = "not found — automatic signature verification is impossible"
script_present = "present — the package will run its own install actions"
script_absent = "absent"

[progress]
heading = "Installing package"
auth = "The system Polkit dialog (KDE Auth / GNOME Polkit) will open now. Enter the administrator password — the wizard never stores or intercepts it."
waiting_polkit = "Waiting for Polkit confirmation…"
preparing = "Preparing…"
progress_waiting = "Waiting to start…"
progress_auth = "Requesting administrator rights…"
checking_deps = "Checking dependencies…"
resolving_deps = "Resolving dependencies…"
checking_integrity = "Checking package integrity…"
loading_files = "Loading package files…"
installing_files = "Unpacking files and installing…"
hooks = "Running post-transaction hooks…"
error = "An error occurred — see the log."
completed = "Installation complete"
failed = "Installation failed"
details = "Installation log"

[finish]
success_title = "Installation complete"
success_body = "Package “{package}” was installed successfully.\n\nClick “Finish” to close ArchSwift."
error_title = "Could not install the package"
error_body = "The package was not installed. Review the message below and the detailed log, fix the problem, then try again."
error_default = "pacman exited with an error."
journal_tail = "Last log lines:"
details = "Installation details"

[dialog]
choose_title = "Choose an Arch Linux package"
filter_name = "Arch Linux packages (*.pkg.tar.zst)"
close_running_title = "Installation is still running"
close_running_detail = "Wait for pacman to finish. Closing the window now may interrupt the installation and leave the system in an incomplete state."
not_local = "The selected file is not a local path."
file_dialog_closed = "Package selection dialog closed: {error}"

[error]
package.open = "Could not open “{path}”: {error}. Check that the file exists and is readable."

[app]
subtitle = "Arch Linux package installer"
window_package = "ArchSwift — {package}"
window_install = "ArchSwift — installing {package}"
window_success = "ArchSwift — installation complete"
window_error = "ArchSwift — installation error"

[common]
dash = "—"
none = "none"
unknown = "unknown"
not_specified = "not specified"
no_description = "No description"
no_licenses = "not specified"

[button]
back = "Back"

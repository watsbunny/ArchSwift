install.wait = "Could not wait for the installation to finish: {error}"
install.auth_cancelled = "Polkit authorization was cancelled or denied. The package was not installed."
install.not_authorized = "Polkit denied execution. Check that the KDE/GNOME authorization agent is running and that the user has administrator rights."

intro = "Гэты майстар усталюе лакальны пакет Arch Linux. Спачатку праверце звесткі пра пакет, затым націсніце «Далей»: сістэма запытае правы адміністратара праз Polkit, пасля чаго пакет будзе ўсталяваны з дапамогай pacman."
section_title = "Звесткі пра пакет"
warning_title = "Важна"
